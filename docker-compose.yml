services:
  db:
    image: postgres:15-alpine  # Версия в контейнере независима от локальных
    env_file:
      - .env # Прямое подключение файла
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5435:5432"  # Порт хоста:порт контейнера. Используем 5435.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U django_user"]
      interval: 5s

  web:
    build: .
    command: /entrypoint.sh
    ports:
      - "8000:8000"
    env_file:
      - .env # Веб-сервис тоже получит доступ к переменным
    environment:
      POSTGRES_NAME: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: db        # Внутри сети Docker - по имени сервиса
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      DEBUG: ${DJANGO_DEBUG}
      # POSTGRES_PORT: 5432   # Не нужно, стандартный порт в контейнере
    depends_on:
      db:
        condition: service_healthy

  pgadmin:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    ports:
      - "5050:80"
    depends_on:
      - db

volumes:
  postgres_data:
