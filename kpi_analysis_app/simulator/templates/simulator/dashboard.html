{% load static %}
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KPI Simulator | Горный участок</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="{% static 'simulator/css/style.css' %}">
</head>
<body>
    <div class="container">
        <h1>Симулятор KPI горного участка</h1>
        <div class="dashboard">
            <!-- Панель управления -->
            <div class="control-panel">
                <h3>Входные параметры</h3>
                <form id="kpiForm">
                    <label>Объём руды (т): <input type="number" id="ore_volume" value="1000"></label>
                    <label>Плановое время (часы): <input type="number" id="operating_time" value="24"></label>
                    <label>Простой (часы): <input type="number" id="downtime" value="2"></label>
                    <label>Численность бригады: <input type="number" id="crew_size" value="15"></label>
                    <label>Расход топлива (л): <input type="number" id="fuel_consumption" value="500"></label>
                    <button type="button" id="calculateBtn">Рассчитать KPI</button>
                </form>
            </div>
            <!-- Панель визуализации -->
            <div class="charts-panel">
                <h3>Ключевые показатели эффективности (KPI)</h3>
                <div class="chart-container">
                    <canvas id="kpiChart"></canvas>
                </div>
                <div class="indicators" id="kpiIndicators">
                    <!-- Здесь появятся численные значения -->
                </div>
            </div>

            <!-- Коэффициент использования оборудования -->
            <div class="kpi-block">
                <h4>Коэффициент использования оборудования</h4>
                <p><strong id="equipment_value">--</strong> %</p>
                <p class="comment" id="interpret_equipment"></p>
            </div>

            <!-- Производительность труда -->
            <div class="kpi-block">
                <h4>Производительность труда</h4>
                <p><strong id="productivity_value">--</strong> %</p>
                <p class="comment" id="interpret_productivity"></p>
            </div>

            <!-- Удельный расход топлива -->
            <div class="kpi-block">
                <h4>Удельный расход топлива</h4>
                <p><strong id="fuel_value">--</strong> %</p>
                <p class="comment" id="interpret_fuel"></p>
            </div>

            <!-- Фактический темп добычи -->
            <div class="kpi-block">
                <h4>Фактический темп добычи</h4>
                <p><strong id="rate_value">--</strong> %</p>
                <p class="comment" id="interpret_rate"></p>
            </div>
        </div>
        <button id="exportCsvBtn" class="btn btn-secondary">Экспорт всех сценариев в CSV</button>
        <select id="scenarioSelect"></select>
        <button id="loadScenarioBtn" class="btn btn-info">Загрузить сценарий</button>
    </div>
    <script type="module" src="{% static 'simulator/js/main.js' %}"></script>
</body>
</html>
